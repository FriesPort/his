spring:
  security:
    csrf:
      enabled: false
  main:
    web-application-type: reactive
  application:
    name: his-gateway
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hospital2?serverTimezone=UTC
    username: root
    password: 123456
  redis:
    database: 0
    host: 8.138.173.253
    lettuce:
      pool:
        max-active: 8 #最大连接数据库连接数,设 -1 为没有限制
        max-idle: 8 #最大等待连接中的数量,设 0 为没有限制
        max-wait: -1ms #最大建立连接等待时间。如果超过此时间将接到异常。设为-1表示无限制。
        min-idle: 0 #最小等待连接中的数量,设 0 为没有限制
      shutdown-timeout: 100ms
    password: 060601hyz
    port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 111.230.250.144:8848
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - DELETE
              - TRACE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
      routes:
        - id: security
          uri: http://127.0.0.1:8888
          predicates:
            - Path=/security/**
        - id: systemanagement
          uri: http://127.0.0.1:9000
          predicates:
            - Path=/system/permission/**,/system/user/**,/system/role/**
        - id: bed
          uri: http://127.0.0.1:8087
          predicates:
            - Path=/beds/**
        - id: patient
          uri: http://127.0.0.1:8085
          predicates:
            - Path=/patient/**
        - id: assign
          uri: http://127.0.0.1:9092
          predicates:
            - Path=/assign/**

server:
  port: 9090

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml

secure:
  openauthorization: true
  white:
    permissions:
      - "admin"
    urls:
      - "/security/login"
      - "/security/logout"

