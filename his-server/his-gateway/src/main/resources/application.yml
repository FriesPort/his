spring:
  security:
    csrf:
      enabled: false
  main:
    web-application-type: reactive
  application:
    name: his-gateway
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hospital2?serverTimezone=UTC
    username: root
    password: 123456
  data:
    redis:
      host: 8.138.173.253
      port: 6379
      password: 060601hyz
  cloud:
    nacos:
      discovery:
        server-addr: 111.230.250.144:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - DELETE
              - TRACE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
      routes:
        - id: security
          uri: http://127.0.0.1:8888
          predicates:
            - Path=/security/**
        - id: systemanagement
          uri: http://127.0.0.1:9000
          predicates:
            - Path=/system/permission/**,/system/user/**,/system/role/**
        - id: bed
          uri: http://127.0.0.1:8087
          predicates:
            - Path=/beds/**
        - id: patient
          uri: http://127.0.0.1:8085
          predicates:
            - Path=/patient/**


